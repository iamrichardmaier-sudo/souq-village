# Plain static site: no build step, publish the repo root.
[build]
  publish = "."
  command = ""

# The agents rewrite these files; never serve a stale copy.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "no-cache"

# Big painted images rarely change; let phones keep them.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Keep repo-only files off the website.
[[redirects]]
  from = "/CLAUDE.md"
  to = "/"
  status = 404
  force = true
[[redirects]]
  from = "/data/brain.json"
  to = "/"
  status = 404
  force = true
